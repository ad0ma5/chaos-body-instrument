<!DOCTYPE html>
<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8" />
        <title>HANDSTRUMENT – Stable Edition</title>
        <style>
        body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #0f0;
        font-family: monospace;
        }
        #debug {
        position: fixed;
        bottom: 0;
        left: 0;
        padding: 6px;
        background: rgba(0,0,0,0.6);
        font-size: 12px;
        }
        .modal, .cmodal{
            position: absolute;
            top: 0;
            left: 0;
            width:100%;
            height: 500px;
            z-index: 2;
        }
        .cmodal{ display: none; background: blue; }
        #start_button{
            width: 100%;
            height: 500px;
        }
        #video{
            z-index: 0;
        }
        #canvas{
            z-index: 1;
        }
        button{ padding: 10px; }
        </style>
    </head>

    <body>

        <div class="modal">
            <button type="button" id="start_button" > START </button>
        </div>
        <div class="cmodal" id="cmodal">
            <h1>Tone.js Sample Configuration</h1>
            <div id="samples"></div>
            <button id="save">Save</button>
            <button id="load">Load</button>
            <button id="cclose">close</button>
        </div>
        <div id="controls">
            <button id="stop_button">Stop</button>
            <button id="toggleVisuals">Toggle Visuals</button>
            <button id="toggleAudio">Toggle Audio</button>
            <button id="toggleDelay">Toggle Delay</button>
            Vol.<input  id="masterVolume" type="range" value="50" />
            thrshld.<input  id="thrshld" type="range" value="10" />
            <button id="toggleConfig">Config</button>
        </div>
        <video id="video" playsinline style="display:none; width : 100%; height : auto; position: absolute;transform: scaleX(-1);"></video>
        <canvas id="canvas" style="display:block; transform: scaleX(-1);width:100%"></canvas>
        <div id="debug"></div>

        <!-- MediaPipe (NO ES MODULES) -->
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
        <script>
/* ================================
   CONFIG
================================ */
const DEBUG = true;
const VIDEO_W = 640;
const VIDEO_H = 480;

/* ================================
   DOM
================================ */
const video = document.getElementById("video");
//const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const debugDiv = document.getElementById("debug");

video.width = VIDEO_W;
video.height = VIDEO_H;
//console.log('vid',video.offsetHeight, [video])
//canvas.width = innerWidth;
//canvas.height = innerHeight;
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const feedbackDelay = new Tone.FeedbackDelay("8n", 0.8).toDestination();

feedbackDelay.wet.value = 0;
// Tone instruments
const leftSynth = new Tone.PluckSynth().connect(feedbackDelay).toDestination();
const rightSynth = new Tone.Synth().connect(feedbackDelay).toDestination();
const drum = new Tone.MembraneSynth().connect(feedbackDelay).toDestination();
const plucky = new Tone.PluckSynth().connect(feedbackDelay).toDestination();

const masterVolume = document.getElementById('masterVolume');

let showVisuals = true;
let audioEnabled = false;
let delayEnabled = false;
let masterVolumeValue = 50;
thrshld.onchange = () => {
    MIN_TRIGGER_INTERVAL = thrshld.value/100;
};
masterVolume.onchange = () => {
    masterVolumeValue = masterVolume.value-50 ;
    console.log(masterVolume.value,masterVolumeValue);
    drum.volume.value = masterVolumeValue;
    leftSynth.volume.value = masterVolumeValue;
    rightSynth.volume.value = masterVolumeValue;
    //feedbackDelay.volume.value = masterVolumeValue;
};
const visualsButton = document.getElementById('toggleVisuals');
visualsButton.onclick = () => {
    showVisuals = !showVisuals;
    console.log('Visuals:', showVisuals, [video]);
    if(showVisuals){
        visualsButton.style.background = 'green';
        const rect = video.getBoundingClientRect();
        console.log('Rendered Width:', rect.width);
        console.log('Rendered Height:', rect.height);
        /*
        canvas.width = rect.width;
        canvas.height = rect.height;
        cwidth = canvas.width/10;
        cheight = canvas.height/8;

        lwidth = canvas.width/6;
        lheight = canvas.height/5;
        zones = buildZones();
        */
        video.style.display = "none";
    }else{
        visualsButton.style.background = '';
        video.style.display = "block";
    }
};
const confButton = document.getElementById('toggleConfig');
toggleConfig.onclick = async () => {
    if(cmodal.style.display !== "block" ){
        cmodal.style.display = "block";
    }else{
        cmodal.style.display = "none";
    }
};
cclose.onclick = async () => {

        cmodal.style.display = "none";
};

const audioButton = document.getElementById('toggleAudio');
audioButton.onclick = async () => {
    if (!audioEnabled) await Tone.start();
    audioEnabled = !audioEnabled;
    console.log('Audio:', audioEnabled);
    if(audioEnabled){
        audioButton.style.background = 'green';
    }else{
        audioButton.style.background = '';
    }
};
const delayButton = document.getElementById('toggleDelay');
delayButton.onclick = async () => {
    if (!delayEnabled) await Tone.start();
    delayEnabled = !delayEnabled;
    console.log('Audio:', delayEnabled, feedbackDelay);
    if(delayEnabled){
        delayButton.style.background = 'green';
        feedbackDelay.wet.value = 1;
    }else{
        delayButton.style.background = '';
        feedbackDelay.wet.value = 0;
    }
};

const startButton = document.getElementById('start_button');
startButton.onclick = async () => {
    console.log('Start Audio:',  [startButton] );
    await Tone.start();
    startButton.parentNode.style.display = 'none';
    audioEnabled = true;
    audioButton.style.background = 'green';
        //visualsButton.style.background = 'green';
        //video.style.display = "none";
    //showVisuals = true
};
document.getElementById('stop_button').onclick=()=>{
  location.reload()
}
/* ================================
   DEBUG
================================ */
function log(msg) {
    if (!DEBUG) return;
    debugDiv.textContent = msg;
}

/* ================================
   GAME STATE
================================ */
const paddleHeight = 200;
const paddleWidth = 20;

let leftPaddleY = canvas.height / 2;
let rightPaddleY = canvas.height / 2;

let ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    vx: 10,
    vy: 4,
    r: 30
};

let scoreL = 0;
let scoreR = 0;

/* ================================
   MEDIAPIPE HANDS (SAFE)
================================ */
const hands = new Hands({
    locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 4,
    modelComplexity: 0, // VERY IMPORTANT
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
});

let handsBusy = false;

hands.onResults(onHands);

/* ================================
   CAMERA (LOCKED)
================================ */
const camera = new Camera(video, {
    width: VIDEO_W,
    height: VIDEO_H,
    onFrame: async () => {
        if (handsBusy) return;
        handsBusy = true;
        try {
            await hands.send({ image: video });
        } catch (e) {
            console.warn("Frame skipped", e);
        }
        handsBusy = false;
    }
});

camera.start();

/* ================================
   HAND RESULTS
================================ */
function onHands(results) {
    //console.log("onHands", results, ctx);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // mirror camera
    ctx.save();
    ctx.scale(-1, 1);
    ctx.translate(-canvas.width, 0);
    //ctx.translate(0,-canvas.width);
    //ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    if (results.multiHandLandmarks) {
        results.multiHandLandmarks.forEach((landmarks, i) => {
            /*
            const wrist = landmarks[0];
      const x = wrist.x * canvas.width;
      const y = wrist.y * canvas.height;

      if (x < canvas.width / 2) {
        leftPaddleY = y;
      } else {
        rightPaddleY = y;
      }
*/
            drawLandmarks(ctx, landmarks, { color: "#0ff" });
            playHands(landmarks);
        });
    }

    //updateBall();
    //drawGame();
}
/* ================================
   PLAY LOGIC https://ai.google.dev/edge/mediapipe/solutions/vision/hand_landmarker
================================ */
let MIN_TRIGGER_INTERVAL = 0.1//0.1; // seconds (≈ 120ms)
let lastTriggerTime = 0;
let notes = ["C4","C5","C6","C7"]
const notesL = ["C","D","E","F","G","A","B"]

function randNotes(){
    for(let i = 0; i < 4; i++){
        notes[i] = notesL[Math.floor(Math.random()*7)]+(Math.floor(Math.random()*4)+2);
    }
}
randNotes()
function playHands(landmarks){

    //console.log(landmarks);
    const mpc = [5, 9, 13, 17]
    const pip = [6, 10, 14, 18]
    const tip = [8, 12, 16, 20]

    for(let i = 0; i < 4; i++){
        const dpip = getDistance(
            landmarks[mpc[i]],
            landmarks[pip[i]]
        );
        const dtip = getDistance(
            landmarks[mpc[i]],
            landmarks[tip[i]]
        )
        if(dtip < dpip){
            //console.log("PLAY", i);
            if(playNote(notes[i], i))
                drawLandmarks(ctx, [landmarks[tip[i]]], { color: "#f00" });
            //drawCircle(landmarks[tip[i]])
        }
    }
    const tdpip = getDistance(
        landmarks[5], // mpc
        landmarks[3] // th ip
    )
    const tdtip = getDistance(
        landmarks[5], // mpc
        landmarks[4] // th tip
    )
    if(tdtip < tdpip){
        //console.log("PLAY drum");
        if(playDrum())
            drawLandmarks(ctx, [landmarks[4]], { color: "#f00" });
        //drawCircle(landmarks[tip[i]])
    }

}
function getDistance(a,b){
    return Math.pow(b.x - a.x, 2) 
        +Math.pow(b.y - a.y, 2) 
    //+Math.pow(b.z - a.z, 2)
}
//const player = new Tone.Player("https://tonejs.github.io/audio/drum-samples/handdrum-loop.mp3");
const drumnotes = ["C1", "C2", "C3", "C4"];
const drumno = Math.floor(Math.random()*4);
const drumactive = drumnotes[drumno];
const player = new Tone.Player("./sounds/d"+drumno+".wav");
player.autostart = false;
const filter = new Tone.AutoFilter(4).start();
const distortion = new Tone.Distortion(0.5);
// connect the player to the filter, distortion and then to the master output
//player.chain(filter, distortion, Tone.Destination);
player.chain(filter, Tone.Destination);

function playNote(note, i){

    const now = Tone.now();
    if (audioEnabled && now - lastTriggerTime > MIN_TRIGGER_INTERVAL) {
        /*
        */
        if(audioPlayers[i]) testSample(i);
        else
        rightSynth.triggerAttackRelease(
            note,//"C5",
            "8n",
            now + 0.001
        );

        lastTriggerTime = now;
        return true;
    }
    return false;
}
function playDrum(){

    const now = Tone.now();
    if (audioEnabled && now - lastTriggerTime > MIN_TRIGGER_INTERVAL) {
        //player.start(); //.triggerAttackRelease(["C1", "E1", "G1", "B1"], 0.5);
        //plucky.triggerAttack(drumactive, "+1");
        if(audioPlayers[4]) testSample(4);
        else
            drum.triggerAttackRelease(
                drumactive,
                "8n",
                now + 0.001
            );
    /*    
    plucky.triggerAttack("C4", "+0.5");
    plucky.triggerAttack("C3", "+1");
    plucky.triggerAttack("C2", "+1.5");
    plucky.triggerAttack("C1", "+2");
*/
        lastTriggerTime = now;
        return true
    }
    return false;
}
function drawCircle(p){
    //console.log(p ,parseInt(p.x*canvas.width) )
    // ball
    ctx.beginPath();
    ctx.arc(parseInt(p.x*canvas.width), parseInt(p.y*canvas.hight), 20/* r */, 0, Math.PI * 2);
    ctx.arc(parseInt(canvas.width), parseInt(canvas.hight), 20/* r */, 0, Math.PI * 2);
    ctx.fillStyle = "#f00";
    ctx.fill();

}
//////config


        const sampleCount = 5;
        const samples = [];
        const audioPlayers = [];
        const sampleDiv = document.getElementById('samples');

        for (let i = 0; i < sampleCount; i++) {
            const div = document.createElement('div');
            div.className = 'sample';
            div.innerHTML = `
                <input type="file" accept="audio/*" id="sample-file-${i}" onchange="updateFileName(${i})">
                <input type="text" placeholder="Sample URL" id="sample-url-${i}">
                <button onclick="testSample(${i})">Test</button>
                <button onclick="stopSample(${i})">Stop</button>
            `;
            samples.push(div);
            sampleDiv.appendChild(div);
            audioPlayers[i] = null;
        }

        function testSample(index) {
            const url = document.getElementById(`sample-url-${index}`).value;
            const fileInput = document.getElementById(`sample-file-${index}`);
            let fileURL = '';

            if (fileInput.files.length > 0) {
                fileURL = URL.createObjectURL(fileInput.files[0]);
            } else {
                fileURL = url;
            }

            const audioPlayer = new Tone.Player(fileURL, () => {
                audioPlayer.toDestination();
                audioPlayer.autostart = true;
                audioPlayer.start();
                audioPlayers[index] = audioPlayer;
            }).toDestination();

            //audioPlayer.on('load', () => {
            //    audioPlayers[index] = audioPlayer;
            //});
        }

        function stopSample(index) {
            if (audioPlayers[index]) {
                audioPlayers[index].stop();
            }
        }

        function updateFileName(index) {
            const fileInput = document.getElementById(`sample-file-${index}`);
            if (fileInput.files.length > 0) {
                document.getElementById(`sample-url-${index}`).value = fileInput.files[0].name;
            }
        }
        document.getElementById('save').onclick = function() {
            const data = samples.map((_, index) => {
                let fileName = document.getElementById(`sample-file-${index}`).files[0] ? document.getElementById(`sample-file-${index}`).files[0].name : '';
                let url = document.getElementById(`sample-url-${index}`).value;
                return { url, fileName };
            });
            localStorage.setItem('samples', JSON.stringify(data));
        }

        document.getElementById('load').onclick = function() {
            const data = JSON.parse(localStorage.getItem('samples'));
            if (data) {
                data.forEach((item, index) => {
                    document.getElementById(`sample-url-${index}`).value = item.url;
                });
            }
        }
</script>

    </body>
</html>
